services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      # Defaults de lab; el profile prod (k8s) no acepta password ecommerce.
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    container_name: ecommerce-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init-topics:
    image: bitnamilegacy/kafka:3.7.1
    container_name: ecommerce-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BOOTSTRAP="$${KAFKA_BOOTSTRAP:-kafka:29092}"
        for t in order-created order-created.DLT payment-processed payment-processed.DLT restock-requested restock-requested.DLT; do
          kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1
          echo "OK topic $$t"
        done
        kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ecommerce-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8089}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: ecommerce-zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ecommerce-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ecommerce-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  auth-service:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/auth-service:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce-auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_FILTER_ENABLED: "true"
      JWT_PUBLIC_PATHS: "/api/v1/auth/login,/api/v1/auth/register"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

  catalogo-service:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/catalogo-service:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: catalogo-service/Dockerfile
    container_name: ecommerce-catalogo
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogo_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CATALOGO_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      JWT_FILTER_ENABLED: "true"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

  pedidos-service:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/pedidos-service:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: pedidos-service/Dockerfile
    container_name: ecommerce-pedidos
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      catalogo-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PEDIDOS_KAFKA_ENABLED: "true"
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      JWT_FILTER_ENABLED: "true"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

  pagos-service:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/pagos-service:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    container_name: ecommerce-pagos
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      pedidos-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pagos_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAGOS_KAFKA_ENABLED: "true"
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      JWT_FILTER_ENABLED: "true"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

  notificaciones-service:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/notificaciones-service:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: ecommerce-notificaciones
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificaciones_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICACIONES_KAFKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      JWT_FILTER_ENABLED: "true"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/ale96glz/microservices-ecommerce}/api-gateway:${IMAGE_VERSION:-latest}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      catalogo-service:
        condition: service_started
      pedidos-service:
        condition: service_started
      pagos-service:
        condition: service_started
      notificaciones-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      PAGOS_SERVICE_URL: http://pagos-service:8084
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8085
      GATEWAY_SECURITY_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GATEWAY_RATE_LIMIT_ENABLED: "true"
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLING_PROBABILITY: "1.0"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
