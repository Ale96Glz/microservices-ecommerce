server:
  port: 8084

spring:
  application:
    name: pagos-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pagos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

pagos:
  kafka:
    enabled: ${PAGOS_KAFKA_ENABLED:false}
  monto-maximo-aprobado: ${PAGOS_MONTO_MAXIMO_APROBADO:100.00}
  outbox:
    poll-interval-ms: ${PAGOS_OUTBOX_POLL_INTERVAL_MS:5000}

pedidos:
  service:
    url: ${PEDIDOS_SERVICE_URL:http://localhost:8083}

kafka:
  retry:
    max-attempts: 3
    backoff-ms: 1000

springdoc:
  default-flat-param-object: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
  filter:
    enabled: ${JWT_FILTER_ENABLED:true}
    public-paths: ${JWT_PUBLIC_PATHS:/swagger-ui,/v3/api-docs,/h2-console}
    public-get-prefixes: ${JWT_PUBLIC_GET_PREFIXES:}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
