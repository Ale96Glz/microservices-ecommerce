server:
  port: 8085

spring:
  application:
    name: notificaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:notificaciones_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

notificaciones:
  kafka:
    enabled: ${NOTIFICACIONES_KAFKA_ENABLED:false}

springdoc:
  default-flat-param-object: true
