server:
  port: 8082

spring:
  application:
    name: catalogo-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:catalogo_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

springdoc:
  default-flat-param-object: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
  filter:
    enabled: ${JWT_FILTER_ENABLED:true}
    public-paths: ${JWT_PUBLIC_PATHS:}
    public-get-prefixes: ${JWT_PUBLIC_GET_PREFIXES:/api/v1/producto,/api/v1/categoria}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
