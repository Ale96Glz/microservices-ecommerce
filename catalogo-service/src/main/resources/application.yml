server:
  port: 8082

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:h2:mem:catalogo_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

springdoc:
  default-flat-param-object: true
