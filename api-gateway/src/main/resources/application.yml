server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/usuario/**
        - id: catalogo-service
          uri: ${CATALOGO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/producto/**,/api/v1/categoria/**
        - id: pedidos-service
          uri: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/pedido/**
        - id: pagos-service
          uri: ${PAGOS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/pago/**
        - id: notificaciones-service
          uri: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notificacion/**

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}

gateway:
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
