# El gateway no tiene datasource; JWT y Redis obligatorios y sin default de lab.
ecommerce:
  prod:
    require-redis-password: true

jwt:
  secret: ${JWT_SECRET}
  filter:
    enabled: false

spring:
  data:
    redis:
      password: ${SPRING_DATA_REDIS_PASSWORD}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - https://ecommerce.local
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
