name: Smoke test (E2E)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de las imagenes en GHCR (ej. 1.1.9, sin latest)"
        required: true
        type: string
      registry:
        description: "Prefijo del registro de imagenes"
        required: false
        default: "ghcr.io/ale96glz/microservices-ecommerce"
        type: string
  workflow_run:
    workflows: ["Release images"]
    types: ["completed"]

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/ale96glz/microservices-ecommerce

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            REGISTRY="${{ inputs.registry }}"
          else
            REGISTRY="${{ env.IMAGE_PREFIX }}"
            TAG=$(git tag --points-at HEAD 'v*' | sort -V | tail -1)
            if [ -z "$TAG" ]; then
              echo "No hay tag v* en este commit. El smoke automatico solo corre tras un release por tag."
              exit 1
            fi
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "Smoke contra $REGISTRY/*:$VERSION"

      - name: Descargar imagenes publicadas
        run: >
          IMAGE_PREFIX="${{ steps.version.outputs.registry }}"
          IMAGE_VERSION="${{ steps.version.outputs.version }}"
          docker compose pull
          postgres kafka zipkin redis
          auth-service catalogo-service pedidos-service pagos-service
          notificaciones-service api-gateway

      - name: Levantar el stack de la aplicacion
        run: >
          IMAGE_PREFIX="${{ steps.version.outputs.registry }}"
          IMAGE_VERSION="${{ steps.version.outputs.version }}"
          docker compose up -d --wait --wait-timeout 180 --no-build
          postgres kafka zipkin redis
          auth-service catalogo-service pedidos-service pagos-service
          notificaciones-service api-gateway

      - name: Ejecutar smoke test E2E
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Logs de todos los servicios (solo si falla)
        if: failure()
        run: docker compose logs --tail=200

      - name: Apagar y limpiar el stack
        if: always()
        run: docker compose down -v -t 30
