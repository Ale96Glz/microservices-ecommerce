name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin prefijo v (ej. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PREFIX="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Image prefix: $PREFIX"

  build-and-push:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalogo-service
          - pedidos-service
          - pagos-service
          - notificaciones-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve-version.outputs.image_prefix }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  github-release:
    needs: [resolve-version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Release v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Imágenes Docker (GHCR)

            Prefijo: `${{ needs.resolve-version.outputs.image_prefix }}`

            ```bash
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/api-gateway:${{ needs.resolve-version.outputs.version }}
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/auth-service:${{ needs.resolve-version.outputs.version }}
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/catalogo-service:${{ needs.resolve-version.outputs.version }}
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/pedidos-service:${{ needs.resolve-version.outputs.version }}
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/pagos-service:${{ needs.resolve-version.outputs.version }}
            docker pull ${{ needs.resolve-version.outputs.image_prefix }}/notificaciones-service:${{ needs.resolve-version.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
