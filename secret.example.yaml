# Plantilla únicamente. No incluir credenciales reales en Git.
# Genera el Secret real con:
# kubectl create secret generic ecommerce-secrets \
#   --namespace ecommerce \
#   --from-literal=POSTGRES_USER=ecommerce \
#   --from-literal=POSTGRES_PASSWORD='cambia-esta-password' \
#   --from-literal=GRAFANA_ADMIN_USER=admin \
#   --from-literal=GRAFANA_ADMIN_PASSWORD='cambia-esta-password-grafana' \
#   --from-literal=JWT_SECRET='genera-un-secreto-de-al-menos-32-caracteres'
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: ecommerce
  POSTGRES_PASSWORD: cambia-esta-password
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: cambia-esta-password-grafana
  JWT_SECRET: genera-un-secreto-de-al-menos-32-caracteres
