# Sin fallback de lab. Si JWT_SECRET o SPRING_DATASOURCE_PASSWORD faltan,
# Spring no arranca. ProductionSecrets rechaza además change-me y ecommerce.
jwt:
  secret: ${JWT_SECRET}
  filter:
    public-paths: ${JWT_PUBLIC_PATHS:/api/v1/auth/login,/api/v1/auth/register}

spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

# El AdminBootstrap de laboratorio no carga con este profile.
auth:
  bootstrap-admin: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
