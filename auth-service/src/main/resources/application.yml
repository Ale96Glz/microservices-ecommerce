server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  filter:
    enabled: ${JWT_FILTER_ENABLED:true}
    public-paths: ${JWT_PUBLIC_PATHS:/api/v1/auth/login,/api/v1/auth/register,/swagger-ui,/v3/api-docs,/h2-console}
    public-get-prefixes: ${JWT_PUBLIC_GET_PREFIXES:}

springdoc:
  default-flat-param-object: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
