apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: ecommerce-microservices
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9411
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx256m -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi