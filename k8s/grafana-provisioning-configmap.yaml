apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ecommerce-microservices
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true