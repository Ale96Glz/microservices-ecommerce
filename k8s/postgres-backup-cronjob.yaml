apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-secrets
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  DEST=/backups/$STAMP
                  mkdir -p "$DEST"
                  cleanup_incomplete() {
                    rm -rf "$DEST"
                  }
                  trap cleanup_incomplete EXIT
                  for db in auth_db catalogo_db pedidos_db pagos_db notificaciones_db; do
                    pg_dump --format=custom --file="$DEST/$db.dump" "$db"
                    echo "OK $db"
                  done
                  trap - EXIT
                  for d in /backups/*; do
                    [ -d "$d" ] || continue
                    n=$(find "$d" -maxdepth 1 -name '*.dump' | wc -l)
                    if [ "$n" -lt 5 ]; then
                      echo "Descartando stamp incompleto $(basename "$d") ($n dumps)"
                      rm -rf "$d"
                    fi
                  done
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
                  echo "Backup $STAMP listo"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
