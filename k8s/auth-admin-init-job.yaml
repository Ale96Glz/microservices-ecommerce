apiVersion: batch/v1
kind: Job
metadata:
  name: auth-admin-init
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: auth-admin-init
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-admin-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: auth-admin-init
          image: ghcr.io/ale96glz/microservices-ecommerce/auth-service:1.1.6
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: AUTH_BOOTSTRAP_ADMIN
              value: "true"
            - name: AUTH_BOOTSTRAP_ADMIN_EXIT
              value: "true"
            - name: AUTH_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: AUTH_ADMIN_EMAIL
            - name: AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: AUTH_ADMIN_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
