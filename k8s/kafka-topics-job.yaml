apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: kafka-init-topics
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init-topics
          image: bitnamilegacy/kafka:3.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:29092
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              BOOTSTRAP="${KAFKA_BOOTSTRAP:-kafka:29092}"
              echo "Esperando a Kafka en $BOOTSTRAP..."
              for i in $(seq 1 30); do
                if kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              for t in order-created order-created.DLT payment-processed payment-processed.DLT restock-requested restock-requested.DLT; do
                kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
                echo "OK topic $t"
              done
              kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
