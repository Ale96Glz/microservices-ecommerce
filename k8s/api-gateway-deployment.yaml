apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ecommerce-microservices
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/ale96glz/microservices-ecommerce/api-gateway:1.0.6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: AUTH_SERVICE_URL
            - name: CATALOGO_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: CATALOGO_SERVICE_URL
            - name: PEDIDOS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PEDIDOS_SERVICE_URL
            - name: PAGOS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PAGOS_SERVICE_URL
            - name: NOTIFICACIONES_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: NOTIFICACIONES_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: SPRING_PROFILES_ACTIVE
            - name: GATEWAY_SECURITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_SECURITY_ENABLED
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: SPRING_DATA_REDIS_PORT
            - name: GATEWAY_RATE_LIMIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_RATE_LIMIT_ENABLED
            - name: GATEWAY_RATE_LIMIT_REPLENISH
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_RATE_LIMIT_REPLENISH
            - name: GATEWAY_RATE_LIMIT_CAPACITY
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_RATE_LIMIT_CAPACITY
            - name: GATEWAY_RATE_LIMIT_LOGIN_REPLENISH
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_RATE_LIMIT_LOGIN_REPLENISH
            - name: GATEWAY_RATE_LIMIT_LOGIN_CAPACITY
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: GATEWAY_RATE_LIMIT_LOGIN_CAPACITY
            - name: ZIPKIN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: ZIPKIN_ENDPOINT
            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: TRACING_SAMPLING_PROBABILITY
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
