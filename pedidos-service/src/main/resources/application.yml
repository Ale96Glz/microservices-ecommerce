server:
  port: 8083

spring:
  application:
    name: pedidos-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pedidos_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

catalogo:
  service:
    url: ${CATALOGO_SERVICE_URL:http://localhost:8082}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

pedidos:
  kafka:
    enabled: ${PEDIDOS_KAFKA_ENABLED:false}

springdoc:
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
